# List for proxy connections on the standard Squid port
http_port 3128

# Use a fixed hostname in Squid-generated messages and logs.
visible_hostname metisa-squid

# Do not create a PID file because Docker manages the running process.
# (This allows the Docker container to be run as --read-only.)
pid_filename none

# Disable optional ICMP measurements because this hardened container
# intentionally has no raw-socket or privilege-elevation capabilities.
pinger_enable off

# Define the destination ports which clients may access.
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443

# CONNECT is the HTTP method used to establish HTTPS tunnels.
acl CONNECT method CONNECT

# Permit access to Squid's manager endpoint only from inside this container.
# The Docker health check uses this endpoint through 127.0.0.1.
http_access allow localhost manager
http_access deny manager

# Reject requests to ports outside the allowed set.
http_access deny !Safe_ports

# Permit CONNECT tunnels only when their destination uses an SSL port.
http_access deny CONNECT !SSL_ports

# Prevent proxy clients from reaching services on the Squid container itself
# or destinations using link-local addresses.
http_access deny to_localhost
http_access deny to_linklocal

# Define address ranges that proxy clients must never reach.
# This cover unspecified, private, loopback, link-local, multicast,
# carrier-grade NAT, reserved, and unique-local address spaces.
acl blocked_destinations dst 0.0.0.0/8
acl blocked_destinations dst 10.0.0.0/8
acl blocked_destinations dst 100.64.0.0/10
acl blocked_destinations dst 127.0.0.0/8
acl blocked_destinations dst 169.254.0.0/16
acl blocked_destinations dst 172.16.0.0/12
acl blocked_destinations dst 192.168.0.0/16
acl blocked_destinations dst 224.0.0.0/4
acl blocked_destinations dst 240.0.0.0/4
acl blocked_destinations dst ::1/128
acl blocked_destinations dst fc00::/7
acl blocked_destinations dst fe80::/10
acl blocked_destinations dst ff00::/8

# Apply the destination-address deny list before any Metisa allow rules.
http_access deny blocked_destinations

# Load the Metisa domain and IP allow rules
# (generated from the [squid_proxy] section of metisa.toml) 
include /etc/squid/metisa-allow.conf

# Deny every request no explicitly permitted by an earlier rule.
# (Squid evaluates http_access rules in order and stops at the first match.)
http_access deny all

# Do not cache proxied requests.
cache deny all

# Send access logs to stdout and operational logs to stderr
# so that Docker can collect them with 'docker.exe container logs'.
access_log stdio:/dev/stdout
cache_log /dev/stderr

# During shutdown, allow active connections up to five seconds to finish
shutdown_lifetime 5 seconds