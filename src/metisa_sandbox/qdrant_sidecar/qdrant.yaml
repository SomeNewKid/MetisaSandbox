log_level: INFO
telemetry_disabled: true

storage:
  storage_path: /qdrant/storage
  snapshots_path: /qdrant/snapshots
  temp_path: /qdrant/storage/snapshots_temp

  performance:
    max_search_threads: 1
    optimizer_cpu_budget: 1

service:
  host: 0.0.0.0
  http_port: 6333
  grpc_port: null
  max_workers: 1
  enable_cors: false

cluster:
  enabled: false