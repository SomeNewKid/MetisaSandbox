    "network",
    "internet",
    # "localnet",
    # "mcp_server",
    # "prompt_guard",
    # "jina_reader",
    # "code_execution",
    # "llm_server",
    # "llm_broker",
]
dependencies = [
    "requests==2.34.2",
    "mcp==2.3.0",
]
environs = [
    "METISA_PROBE_1=hard-coded value",
    "METISA_PROBE_2=${host:METISA_PROBE_2}",
]
