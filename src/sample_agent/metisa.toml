agent_name = "sample_agent"
capabilities = [
    "network",
    "internet",
    "localnet",
    "mcp_server",
    "prompt_guard",
    "entity_guard",
    "jina_reader",
    "code_execution",
    # "llm_server",
    # "llm_broker",
    "docling",
    "documents",
    "qdrant",
    "embeddings",
    "otel_collector",
]
dependencies = [
    "cryptography==48.0.1",
    "requests==2.34.2",
    "mcp==2.3.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
]
environs = [
    "METISA_PROBE_1=hard-coded value",
    "METISA_PROBE_2=${host:METISA_PROBE_2}",
    "OTEL_SERVICE_NAME=sample_agent",
    "OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://metisa-otel-collector:4318/v1/traces",
]
secrets = [
    "secret_key=secret_value222",
]
settings = [
    "local_models_directory=C:/Git/__Models",
]

[squid_proxy]
environs = []
allowed_domains = [
  ".example.com",
  ".openai.com",
]
allowed_ip_addresses = []

[haproxy]
environs = []
backends = [
    { listen_port = 3306, host = "host.docker.internal", port = 3306 },
]

[mcp_server]
environs = [
    "OTEL_SERVICE_NAME=metisa-mcp-server",
    "OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://metisa-otel-collector:4318/v1/traces",
]
secrets = [
    "SANDBOX_TESTER_MARIADB_CREDENTIALS=${host:SANDBOX_TESTER_MARIADB_CREDENTIALS}",
]
tools = [
    "get_active_items",
    "get_title_from_url",
    "read_content_from_url",
    "execute_starlark_code",
    "classify_text",
    "moderate_text",
    "anonymize_text",
    "extract_markdown_from_document",
    "retrieve_from_documents",
    "get_matching_chunks",
]
resources = []

[jina_reader]
environs = []

[llm_server]
models = [
    { alias="granite-4-1b", repo = "ibm-granite/granite-4.0-1b-GGUF", revision = "b27c2fe3f211b7f44e80fa620177aea371099aaa", filename = "granite-4.0-1b-Q4_K_M.gguf" },
    # { alias="qwen-3-small", repo = "bartowski/Qwen_Qwen3-1.7B-GGUF", revision = "dcb19155b962dbb6389f4691a982043a8e651022", filename = "Qwen_Qwen3-1.7B-Q4_K_M.gguf" },
]

[llm_broker]
environs = []
secrets = [
    "OPENAI_API_KEY=${host:OPENAI_API_KEY}",
]
local_models = [
    "granite-4-1b",
    # "qwen-3-small",
]
online_models = [
    "gpt-4o",
]

[docling]
environs = [
    "DOCLING_ARTIFACTS_PATH=/models/docling",
    "HF_HUB_OFFLINE=1",
    "OPENBLAS_NUM_THREADS=1",
    "OMP_NUM_THREADS=1",
    "MKL_NUM_THREADS=1",
    "DOCLING_NUM_THREADS=1",
]
embedding_model = "BAAI/bge-small-en-v1.5"

[documents]
environs = []
local_directory = ".docs"

[qdrant]
environs = []

[embeddings]
environs = []

[otel_collector]
environs = []