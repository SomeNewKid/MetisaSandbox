[project]
name = "metisa-sandbox"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests==2.34.2",
    "pymysql==1.2.3",
    "mcp==2.3.0",
    "unidecode==1.4.0",
    "accelerate==1.15.0",
    "torch==2.14.1",
    "transformers==5.19.0",
    "spacy==3.8.16",
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
]

[project.scripts]
metisa-sandbox = "metisa_sandbox.cli:main"

[project.optional-dependencies]
dev = [
    "pyright",
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"